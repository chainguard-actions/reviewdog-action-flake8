name: Test fail_level causes exit 1 on errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Python file with flake8 errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bad_src"
          cat > "$GITHUB_WORKSPACE/bad_src/bad_code.py" << 'EOF'
          import os
          import sys
          x=1
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: "dummy-token"
          workdir: bad_src
          reporter: local
          filter_mode: nofilter
          fail_level: error

      - name: Assert action failed due to flake8 errors with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=error and lint errors present"
            exit 1
          fi
          echo "PASS: action correctly failed when fail_level=error and errors found"
