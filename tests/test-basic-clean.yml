name: Test basic usage with clean Python code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install flake8
        run: python -m pip install --upgrade flake8

      - name: Create clean Python file in isolated subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cleandir"
          printf 'x = 1\ny = 2\nz = x + y\nprint(z)\n' > "$GITHUB_WORKSPACE/cleandir/clean_sample.py"

      - name: Run flake8 action on clean code
        id: action
        uses: .
        with:
          github_token: "dummy-token-for-local-test"
          workdir: "cleandir"
          reporter: "local"
          fail_on_error: "true"
          filter_mode: "nofilter"
          flake8_args: "--max-line-length=120"

      - name: Assert action completed successfully
        run: |
          echo "PASS: flake8 action ran successfully on clean Python code"
