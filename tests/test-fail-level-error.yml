name: Test fail_level=error causes failure when errors found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python and flake8
        run: |
          python3 --version
          python3 -m pip install --upgrade pip flake8

      - name: Set up fake wget for reviewdog install
        run: |
          chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fake-wget.sh"
          mkdir -p "$HOME/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-wget.sh" "$HOME/bin/wget"
          chmod +x "$HOME/bin/wget"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run action on code with errors and fail_level=error (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/python
          flake8_args: "with_errors.py"
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=error when flake8 finds errors, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with fail_level=error"
