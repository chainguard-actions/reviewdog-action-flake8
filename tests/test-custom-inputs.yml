name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install flake8
        run: python -m pip install --upgrade flake8

      - name: Create clean Python file in isolated subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/appdir"
          printf 'def greet(name):\n    return "Hello, " + name\n\n\nprint(greet("world"))\n' > "$GITHUB_WORKSPACE/appdir/app.py"

      - name: Run flake8 action with custom tool_name and level
        id: action
        uses: .
        with:
          github_token: "dummy-token-for-local-test"
          workdir: "appdir"
          tool_name: "my-flake8"
          level: "warning"
          reporter: "local"
          fail_on_error: "false"
          filter_mode: "nofilter"

      - name: Assert action completed successfully
        run: |
          echo "PASS: flake8 action ran with custom tool_name and level inputs"
